name: Deploy

# The simple path: a long-lived Cloudflare API token stored as a GitHub
# Actions secret. Perfectly fine for a personal project. When you outgrow it,
# switch to one of the deploy-keyless-*.yml workflows and delete this file.
#
# Setup:
#   1. GitHub repo secrets:  CLOUDFLARE_API_TOKEN (Pages › Edit),
#                            CLOUDFLARE_ACCOUNT_ID
#   2. GitHub repo variables: CLOUDFLARE_PAGES_PROJECT_NAME, NEXT_PUBLIC_SITE_URL
#   3. terraform/cloudflare provisions the Pages project, domain, and DNS.

# Ships inert on purpose: manual runs only, so this template repo (and every
# fresh clone) never fires a failing deploy against an unconfigured account.
# To activate real deploys, finish the setup above and uncomment the triggers.
on:
  # push:
  #   branches: [main]
  # pull_request:
  #   branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Pushes to main deploy to the protected production environment; pull
    # requests deploy to the open preview environment.
    environment: ${{ (github.event_name != 'pull_request' && github.ref == 'refs/heads/main') && 'production' || 'preview' }}
    # Skip deploys for PRs from forks (no access to the environment / secrets).
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build static site
        env:
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
        run: pnpm build

      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          command: >-
            pages deploy out
            --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT_NAME }}
            ${{ (github.event_name != 'pull_request' && github.ref == 'refs/heads/main') && '--branch=main' || '' }}

      - name: Deployment summary
        run: |
          {
            echo "### ${{ vars.CLOUDFLARE_PAGES_PROJECT_NAME }}"
            echo ""
            echo "- Type: ${{ (github.event_name != 'pull_request' && github.ref == 'refs/heads/main') && 'production' || 'preview' }}"
            echo "- URL: ${{ steps.deploy.outputs.deployment-url }}"
          } >> "$GITHUB_STEP_SUMMARY"
