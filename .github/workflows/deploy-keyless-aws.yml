name: 'Deploy (keyless: AWS Secrets Manager)'

# The AWS counterpart of the GCP pattern: no AWS access keys and no Cloudflare
# token stored in GitHub. GitHub mints an OIDC token, AWS IAM exchanges it for
# temporary credentials on a role whose trust policy only trusts THIS
# repository, and the workflow reads the Cloudflare credentials from Secrets
# Manager at deploy time.
#
# Setup: terraform/aws provisions everything (OIDC provider, role, secret
# container, GitHub environments + variables). The secret value is added
# out-of-band as JSON:
#   aws secretsmanager put-secret-value --secret-id <id> --secret-string \
#     '{"CLOUDFLARE_API_TOKEN":"...","CLOUDFLARE_ACCOUNT_ID":"..."}'

# Ships inert on purpose: manual runs only, so this template repo (and every
# fresh clone) never fires a failing deploy against an unconfigured account.
# To activate real deploys, finish the setup above and uncomment the triggers.
on:
  # push:
  #   branches: [main]
  # pull_request:
  #   branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write # required to mint the OIDC token AWS IAM trusts
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ (github.event_name != 'pull_request' && github.ref == 'refs/heads/main') && 'production' || 'preview' }}
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Authenticate to AWS (OIDC, no stored keys)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOYER_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Fetch Cloudflare credentials from Secrets Manager
        id: cloudflare
        env:
          SECRET_ID: ${{ vars.AWS_SECRET_ID }}
        run: |
          set -euo pipefail
          secret=$(aws secretsmanager get-secret-value \
            --secret-id "$SECRET_ID" --query SecretString --output text)
          api_token=$(jq -r '.CLOUDFLARE_API_TOKEN' <<<"$secret")
          account_id=$(jq -r '.CLOUDFLARE_ACCOUNT_ID' <<<"$secret")
          echo "::add-mask::${api_token}"
          echo "api_token=${api_token}" >> "$GITHUB_OUTPUT"
          echo "account_id=${account_id}" >> "$GITHUB_OUTPUT"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build static site
        env:
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
        run: pnpm build

      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ steps.cloudflare.outputs.api_token }}
          accountId: ${{ steps.cloudflare.outputs.account_id }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          command: >-
            pages deploy out
            --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT_NAME }}
            ${{ (github.event_name != 'pull_request' && github.ref == 'refs/heads/main') && '--branch=main' || '' }}

      - name: Deployment summary
        run: |
          {
            echo "### ${{ vars.CLOUDFLARE_PAGES_PROJECT_NAME }}"
            echo ""
            echo "- Type: ${{ (github.event_name != 'pull_request' && github.ref == 'refs/heads/main') && 'production' || 'preview' }}"
            echo "- URL: ${{ steps.deploy.outputs.deployment-url }}"
          } >> "$GITHUB_STEP_SUMMARY"
